# CU-UP for the sno2 E2E deployment. Inside the RanDeployment the operator
# injects the E1 peer (the CU-CP's -e1 Service), so e1ap is not set here. The
# operator renders the <name>-n3 and <name>-f1u Services (UDP 2152).
apiVersion: ran.ocudu.org/v1alpha1
kind: CuUp
metadata:
  name: ocudu-cuup
  namespace: ran
spec:
  runtime:
    image:
      repository: registry.gitlab.com/ocudu/ocudu/images/cu-up
      tag: ubuntu-24.04-avx512-20260930_cb9ca3f2-stable
    resources:
      # PROPOSAL (sizing not decided yet).
      cpu: "4"
      memory: 8Gi
    serviceAccount:
      name: ocudu-ran
  observability:
    logs:
      type: none # logs go to stdout (decision D6)
  cuUp:
    plmnList:
      - "00101"
  ngu:
    socket:
      - bindAddr: 0.0.0.0
  log:
    allLevel: info
