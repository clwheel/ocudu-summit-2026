# The core's pods run under the namespace's default ServiceAccount with a
# fixed non-root UID (1001) that restricted-v2 rejects. nonroot-v2 permits any
# non-root UID without anyuid (operator docs/platforms/openshift/README.md).
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: open5gs-nonroot-scc
  namespace: open5gs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:nonroot-v2
subjects:
  - kind: ServiceAccount
    name: default
    namespace: open5gs
