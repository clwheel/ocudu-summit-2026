apiVersion: v1
kind: ConfigMap
metadata:
  name: clusterinstance-defaults-v1
  namespace: sno-ran-du-v4-22-14
data:
  # clusterInstallationTimeout is optional.
  # The value should be a duration string
  # (e.g., "80m" for 80 minutes)
  # clusterInstallationTimeout: "80m"
  clusterinstance-defaults: |
    baseDomain: demo.lab
    extraLabels:
      ManagedCluster:
        cluster-version: "v4.22"
        sno-ocudu-policy: "v1"
    clusterType: SNO
    clusterImageSetNameRef: "img4.22.14-x86-64-appsub"
    pullSecretRef:
      name: pull-secret
    networkType: OVNKubernetes
    sshPublicKey: ssh-rsa xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
    installConfigOverrides: '{"capabilities": {"baselineCapabilitySet": "None", "additionalEnabledCapabilities": ["NodeTuning", "OperatorLifecycleManager", "Ingress", "marketplace"]}}'
    ignitionConfigOverride: '{"ignition": {"version": "3.2.0"}, "storage": {"files": [{"overwrite": true, "path": "/etc/containers/policy.json", "contents": {"source":"data:text/plain;base64,"}}]}}'
    clusterNetwork:
      - cidr: 10.128.0.0/14
        hostPrefix: 23
    machineNetwork:
      - cidr: 192.160.123.0/25
    serviceNetwork:
      - cidr: 172.30.0.0/16
    additionalNTPSources:
      - 192.168.123.40
    templateRefs:
      - name: ai-cluster-templates-v1
        namespace: open-cluster-management
    cpuPartitioningMode: AllNodes
    extraManifestsRefs:
      - name: sno-ran-du-extra-manifest-1
    nodes:
      - role: master
        bootMode: UEFI
        rootDeviceHints:
          deviceName: /dev/disk/by-path/pci-0000:5c:00.0-scsi-0:1:0:0
        nodeNetwork:
          interfaces:
            - name: ens4f0
              label: boot-interface
          config:
            routes:
              config:
                - destination: 0.0.0.0/0
                  next-hop-interface: ens4f0
                  table-id: 254
            interfaces:
              - ipv6:
                  enabled: false
                ipv4:
                  enabled: true
                name: ens4f0
                state: up
                type: ethernet
        templateRefs:
          - name: ai-node-templates-v1
            namespace: open-cluster-management
